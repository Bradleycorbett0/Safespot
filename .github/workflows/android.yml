name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Clean previous Buildozer directories
      run: |
        rm -rf .buildozer
        rm -rf bin
        mkdir -p bin

    - name: Install Linux + Kivy dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          zip unzip git openjdk-17-jdk python3-pip \
          libpython3-dev libssl-dev libffi-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libgles2-mesa-dev libgl1-mesa-dev
        pip install --upgrade pip cython buildozer

    - name: Prepare Android SDK folders
      run: |
        mkdir -p $HOME/android/sdk
        mkdir -p $HOME/android/ndk

    - name: Install Android NDK r25b
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
        unzip ndk.zip -d $HOME/android/ndk

    - name: Install Android cmdline-tools
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O cmd.zip
        unzip cmd.zip -d $HOME/android/sdk/cmdline-tools
        mv $HOME/android/sdk/cmdline-tools/cmdline-tools $HOME/android/sdk/cmdline-tools/latest

    - name: Install Android packages
      run: |
        yes | $HOME/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android/sdk \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Set environment
      run: |
        echo "ANDROIDSDK=$HOME/android/sdk" >> $GITHUB_ENV
        echo "ANDROIDNDK=$HOME/android/ndk/android-ndk-r25b" >> $GITHUB_ENV
        echo "PATH=$HOME/android/sdk/platform-tools:$HOME/android/sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safespot-apk
        path: bin/*.apk
