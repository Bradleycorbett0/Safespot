name: Build SafeSpot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip tar wget curl \
            build-essential \
            clang lld \
            libffi-dev libssl-dev \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev

      - name: Hard clean old build
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin
          rm -rf ~/.cache/pip
          rm -rf ~/.gradle/caches

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.36
          python -m pip install buildozer==1.5.0

      - name: Setup Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools/* android-sdk/cmdline-tools/ || true
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Show Buildozer config
        run: |
          cat buildozer.spec
          grep -n "requirements" buildozer.spec || true
          grep -n "p4a.branch" buildozer.spec || true

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeSpot-APK
          path: bin/*.apk
