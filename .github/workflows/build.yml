name: Build SafeSpot App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip git
          pip install buildozer cython virtualenv

      - name: Build AAB (Play Store build)
        run: |
          buildozer init
          echo "package.name = safespot" >> buildozer.spec
          echo "package.domain = com.bradleycorbettjones" >> buildozer.spec
          echo "package.title = SafeSpot" >> buildozer.spec
          buildozer -v android release

      - name: Build APK (for phone testing)
        run: |
          buildozer -v android debug

      - name: Upload release files
        uses: actions/upload-artifact@v3
        with:
          name: safespot-builds
          path: |
            bin/*.aab
            bin/*.apk
