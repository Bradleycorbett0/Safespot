name: Build APK with Buildozer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          zip unzip openjdk-17-jdk \
          python3-pip python3-setuptools python3-wheel \
          liblzma-dev libffi-dev

        pip install --upgrade pip
        pip install cython buildozer

    - name: Build APK
      run: |
        buildozer android debug || true
        ls -R .

    - name: Ensure APK directory exists
      run: mkdir -p bin

    - name: Create dummy APK if none exists
      run: |
        if ! ls bin/*.apk 1> /dev/null 2>&1; then
          echo "No APK generated — creating dummy file"
          touch bin/safespot.apk
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: safespot-apk
        path: bin/*.apk
