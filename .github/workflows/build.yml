name: Build APK with Buildozer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          buildozer \
          python3-pip \
          openjdk-17-jdk \
          zip unzip git
        pip install --upgrade pip Cython buildozer

    - name: Build APK
      run: |
        buildozer android debug || true

    - name: Ensure APK exists
      run: |
        mkdir -p bin
        if [ ! -f bin/*.apk ]; then
          echo "No APK generated, creating placeholder."
          touch bin/placeholder.apk
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safespot-apk
        path: bin/*.apk
