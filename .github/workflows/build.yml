name: Build SafeSpot App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip git zip openjdk-17-jdk python3-setuptools python3-wheel unzip wget

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Install Android SDK and accept licenses
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O sdk-tools.zip
          unzip sdk-tools.zip -d cmdline-tools
          yes | cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
          yes | cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-33" "build-tools;34.0.0"

      - name: Build release (AAB)
        run: |
          buildozer init || true
          echo "package.name = safespot" >> buildozer.spec
          echo "package.domain = com.bradleycorbettjones" >> buildozer.spec
          echo "package.title = SafeSpot" >> buildozer.spec
          buildozer android release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safespot-builds
          path: |
            bin/*.aab
            bin/*.apk
