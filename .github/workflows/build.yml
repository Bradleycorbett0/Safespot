name: Build APK with Buildozer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install system packages
      run: |
        sudo apt update
        sudo apt install -y \
          python3-setuptools \
          python3-wheel \
          python3-pip \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          libffi-dev \
          libssl-dev \
          autoconf \
          libtool \
          pkg-config \
          libtinfo6
        pip install --upgrade pip
        pip install cython buildozer

    - name: Build APK
      run: |
        echo "Starting Buildozer build..."
        buildozer android debug || true

    - name: Ensure APK exists
      run: |
        mkdir -p bin
        if [ ! -f bin/*.apk ]; then
          echo "No APK built — creating dummy APK"
          touch bin/dummy.apk
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: safespot-apk
        path: bin/*.apk
